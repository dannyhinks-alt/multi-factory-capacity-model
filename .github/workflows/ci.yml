name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Offline single-file build
        run: npm run build:offline
      - name: Verify zero external references
        run: |
          test -f dist-offline/index.html
          if grep -Eo '(src|href)="https?://[^"]+"' dist-offline/index.html; then
            echo "External asset reference found in offline build" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: multi-factory-hub-offline
          path: dist-offline/index.html
